<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AegisCore — Cybersecurity & Systems Architecture</title>
  <style>
    :root {
      --bg: #020408;
      --panel: rgba(8, 14, 24, 0.85);
      --border: rgba(0, 243, 255, 0.2);
      --text: #e2f1f8;
      --muted: #8ca3bf;
      --cyan: #00f3ff;
      --emerald: #00ff88;
      --crimson: #ff0055;
      --amber: #ffaa00;
      --max: 1200px;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background-color: var(--bg);
      background-image: 
        radial-gradient(circle at 10% 10%, rgba(255, 0, 85, 0.18) 0%, transparent 45%),
        radial-gradient(circle at 90% 20%, rgba(0, 243, 255, 0.18) 0%, transparent 45%),
        radial-gradient(circle at 50% 90%, rgba(0, 255, 136, 0.15) 0%, transparent 50%),
        linear-gradient(rgba(2, 4, 8, 0.9), rgba(2, 4, 8, 0.9));
      background-attachment: fixed;
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.7;
    }
    a { color: inherit; text-decoration: none; }
    .wrap { width: min(var(--max), calc(100% - 48px)); margin: auto; }
    
    header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(2, 4, 8, 0.85);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border-bottom: 1px solid rgba(0, 243, 255, 0.15);
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }
    .nav { min-height: 80px; display: flex; align-items: center; justify-content: space-between; }
    .brand { display: flex; align-items: center; gap: 12px; font-weight: 900; letter-spacing: .08em; font-size: 1.15rem; }
    .mark {
      display: grid; place-items: center; width: 42px; height: 42px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--crimson), var(--cyan), var(--emerald));
      color: #020408; font-weight: 900; font-size: 1.25rem;
      box-shadow: 0 0 25px rgba(0, 243, 255, 0.5);
      animation: corePulse 4s ease-in-out infinite alternate;
    }
    @keyframes corePulse {
      0% { box-shadow: 0 0 15px rgba(0, 243, 255, 0.4); transform: scale(1); }
      100% { box-shadow: 0 0 35px rgba(255, 0, 85, 0.6); transform: scale(1.03); }
    }
    nav { display: flex; gap: 30px; color: var(--muted); font-size: .95rem; font-weight: 600; }
    nav a:hover { color: var(--cyan); text-shadow: 0 0 12px var(--cyan); }
    
    .hero { padding: 100px 0 80px; display: grid; grid-template-columns: 1.25fr .75fr; align-items: center; gap: 60px; }
    .eyebrow {
      font-size: .8rem; font-weight: 800; letter-spacing: .2em; text-transform: uppercase;
      background: linear-gradient(90deg, var(--crimson), var(--cyan), var(--emerald));
      -webkit-background-clip: text; background-clip: text; color: transparent;
      filter: drop-shadow(0 0 10px rgba(0,243,255,0.3));
    }
    h1 { font-size: clamp(2.8rem, 6vw, 5.2rem); line-height: 1.05; letter-spacing: -.04em; margin: 16px 0 20px; }
    h1 em { font-style: normal; color: transparent; background: linear-gradient(90deg, var(--cyan), var(--emerald)); -webkit-background-clip: text; background-clip: text; }
    .lead { color: var(--muted); font-size: 1.15rem; max-width: 620px; }
    .actions { display: flex; gap: 16px; margin-top: 32px; }
    .btn {
      padding: 14px 28px; border-radius: 14px; font-weight: 800; font-size: .95rem;
      border: 1px solid var(--border); transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); cursor: pointer;
    }
    .btn:hover { transform: translateY(-3px); }
    .primary {
      background: linear-gradient(135deg, var(--cyan), var(--emerald));
      color: #020408; border: none; font-weight: 900;
      box-shadow: 0 0 30px rgba(0, 243, 255, 0.5);
    }
    .primary:hover { box-shadow: 0 0 45px rgba(0, 255, 136, 0.8); }
