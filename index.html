<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AegisCore — Cybersecurity & Systems Architecture</title>
  <style>
    :root {
      --bg: #060a12;
      --panel: rgba(13, 22, 38, 0.75);
      --border: rgba(0, 243, 255, 0.25);
      --border-glow: rgba(0, 243, 255, 0.6);
      --text: #e2f1f8;
      --muted: #8ca3bf;
      --cyan: #00f3ff;
      --emerald: #00ff88;
      --crimson: #ff0055;
      --amber: #ffaa00;
      --max: 1200px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(circle at 10% 10%, rgba(255, 0, 85, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 90% 20%, rgba(0, 243, 255, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 50% 80%, rgba(0, 255, 136, 0.1) 0%, transparent 50%);
      background-attachment: fixed;
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .wrap {
      width: min(var(--max), calc(100% - 48px));
      margin: 0 auto;
    }

    /* HEADER & NAV */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(6, 10, 18, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
    }

    .nav {
      min-height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
      letter-spacing: .08em;
      font-size: 1.15rem;
    }

    .mark {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--crimson), var(--cyan));
      color: #060a12;
      font-weight: 900;
      font-size: 1.1rem;
      box-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
      animation: corePulse 4s ease-in-out infinite alternate;
    }

    @keyframes corePulse {
      0% { box-shadow: 0 0 15px rgba(0, 243, 255, 0.3); }
      100% { box-shadow: 0 0 30px rgba(255, 0, 85, 0.5); }
    }

    nav {
      display: flex;
      gap: 24px;
      color: var(--muted);
      font-size: .95rem;
      font-weight: 600;
    }

    nav a:hover {
      color: var(--cyan);
      text-shadow: 0 0 10px var(--cyan);
    }

    /* HERO SECTION */
    .hero {
      padding: 90px 0 60px;
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      align-items: center;
      gap: 40px;
    }

    @media (max-width: 900px) {
      .hero {
        grid-template-columns: 1fr;
      }
    }

    .eyebrow {
      font-size: .85rem;
      font-weight: 800;
      letter-spacing: .2em;
      text-transform: uppercase;
      background: linear-gradient(90deg, var(--crimson), var(--cyan), var(--emerald));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      display: inline-block;
      margin-bottom: 12px;
    }

    h1 {
      font-size: clamp(2.4rem, 5vw, 4.2rem);
      line-height: 1.1;
      letter-spacing: -.03em;
      margin-bottom: 16px;
    }

    h1 em {
      font-style: normal;
      background: linear-gradient(90deg, var(--cyan), var(--emerald));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .lead {
      color: var(--muted);
      font-size: 1.1rem;
      max-width: 580px;
      margin-bottom: 28px;
    }

    .actions {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 12px 24px;
      border-radius: 10px;
      font-weight: 700;
      font-size: .9rem;
      border: 1px solid var(--border);
      transition: all 0.3s ease;
